name: Fuzz

on:
  schedule:
    # Nightly. Fuzzing on every pull request would add ten minutes to every
    # review for a target that finds something once a month; on a schedule it
    # runs long enough to be worth running.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The redactor is where a fuzz finding would be a silent leak rather
          # than a crash, which is why it has two targets.
          - package: ./internal/redact
            target: FuzzRedact
          - package: ./internal/redact
            target: FuzzDetect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: fuzz
        run: |
          go test ${{ matrix.package }} -run '^$' \
            -fuzz '^${{ matrix.target }}$' \
            -fuzztime '${{ inputs.fuzztime || '10m' }}'

      # A crasher is only useful if it leaves the runner. Uploading it means the
      # failing input can be added to testdata as a seed, which is where an
      # interesting case belongs.
      - name: upload the failing corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**
            $HOME/.cache/go-build/fuzz/**
          if-no-files-found: warn
