name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Sluice has three direct dependencies. A pull request that adds one
          # with a known vulnerability, or with a licence incompatible with
          # Apache 2.0, should not be a discussion in review -- it should fail.
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
