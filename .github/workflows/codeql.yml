name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a new query pack finds things in code that has not
    # changed. Off-peak on a Monday so a finding is waiting at the start of a
    # working week rather than at the end of one.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          # security-extended over the default pack: this is a security product,
          # and the extra queries' false-positive rate is a price worth paying
          # on a codebase this size.
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
