version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for the whole Prometheus client tree rather than four:
      # they move together and reviewing them apart is busywork.
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      # Patch bumps of everything else, batched. A patch release that breaks the
      # build is caught by CI, and a separate pull request per patch is how a
      # repository trains people to merge dependency updates without reading.
      patch:
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"
