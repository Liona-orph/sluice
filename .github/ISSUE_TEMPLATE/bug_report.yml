name: Bug report
description: Something behaves differently from what is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        If this is a security vulnerability, close this and use private
        reporting instead. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Ideally against the built-in offline defaults, since those are the same
        everywhere. A curl command and the configuration you changed is usually
        enough.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sluice version`.
      placeholder: sluice v0.1.0 (abc1234), go1.23.4 linux/amd64
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        Output of `sluice serve --print-config`, which already redacts key
        secrets and the hash salt. Check it before pasting anyway.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant log lines and the X-Sluice-Request-Id of a failing request if
        you have one. Do not paste an audit record containing prompts, even
        redacted ones, unless you have read it first.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I have removed anything sensitive from the text above.
          required: true
        - label: I checked the "What this is not" section of the README, in case this is a documented limitation.
          required: true
